name: Test and deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test site
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download production files
        uses: actions/download-artifact@v4
        with:
          name: portfolio-site
          path: dist

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify deployment configuration
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_S3_BUCKET"
          test -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Sync site to S3
        run: aws s3 sync dist "s3://${{ vars.AWS_S3_BUCKET }}" --delete --only-show-errors --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
